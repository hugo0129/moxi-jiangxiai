# jiangxiai.top - Nginx 配置
# 部署路径: /etc/nginx/sites-available/jiangxiai.top
# 启用: ln -s /etc/nginx/sites-available/jiangxiai.top /etc/nginx/sites-enabled/

# ---------- HTTP -> HTTPS 重定向 ----------
server {
    listen 80;
    listen [::]:80;
    server_name jiangxiai.top www.jiangxiai.top;
    return 301 https://jiangxiai.top$request_uri;
}

# ---------- www -> 非 www HTTPS ----------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.jiangxiai.top;

    ssl_certificate     /etc/nginx/ssl/jiangxiai.top.pem;
    ssl_certificate_key /etc/nginx/ssl/jiangxiai.top.key;
    return 301 https://jiangxiai.top$request_uri;
}

# ---------- 主站 ----------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name jiangxiai.top;

    root /var/www/jiangxiai.top;
    index index.html;

    # SSL 证书 (阿里云免费 DV 证书)
    ssl_certificate     /etc/nginx/ssl/jiangxiai.top.pem;
    ssl_certificate_key /etc/nginx/ssl/jiangxiai.top.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ---------- 安全头 ----------
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ---------- gzip 压缩 ----------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/javascript application/json application/xml
               application/rss+xml image/svg+xml font/woff font/woff2;

    # ---------- 缓存策略 ----------
    # HTML 不缓存（总是拿最新）
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    }

    # 静态资源长缓存
    location ~* \.(css|js|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable" always;
    }

    # 图片长缓存
    location ~* \.(webp|jpg|jpeg|png|gif|ico|svg)$ {
        expires 90d;
        add_header Cache-Control "public" always;
    }

    # ---------- 路由 ----------
    # sitemap 和 robots
    location = /sitemap.xml {
        default_type application/xml;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /robots.txt {
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600";
    }

    # 404 页面
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header X-Robots-Tag "noindex, follow" always;
    }

    # 默认
    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
